title: Applied Analysis
description: Selected analytical case studies, software projects, and applied AI work by Ryan Kirk.
theme: minima
url: https://ryan-kirk.github.io
baseurl: /applied-analysis
markdown: kramdown
permalink: pretty
show_excerpts: true
plugins:
  - jekyll-feed
collections:
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: default
      comments: true
  - scope:
      path: ""
      type: "projects"
    values:
      layout: default
      comments: false
  - scope:
      path: ""
    values:
      layout: default
      comments: false
